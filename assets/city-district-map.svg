  <rect x="30" y="12" width="255" height="225" fill="url(#blocks)"/>
  <rect x="30" y="12" width="255" height="225" fill="url(#street-grid)" opacity=".7"/>
  <rect x="30" y="12" width="255" height="225" fill="url(#fine-grid)"/>
