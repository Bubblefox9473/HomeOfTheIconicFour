<!-- Distinctive irregular City silhouette, not the external circular border. -->
<use href="#city-outline" fill="none" stroke="#f1554b" stroke-width="3.7" opacity=".35" filter="url(#soft-red-glow)"/>
<use href="#city-outline" fill="none" stroke="#d76153" stroke-width="1.2" stroke-linejoin="round" opacity=".85"/>

<g font-family="'Arial Narrow','Roboto Condensed',Arial,sans-serif" fill="#d3695a" stroke="none" letter-spacing=".12px">
  <style>
    .district-label .wing-letter{font-family:'Arial Narrow',Impact,sans-serif;font-size:10px;font-stretch:condensed;font-weight:800;fill:#d65d53;paint-order:stroke;stroke:#7b221f;stroke-width:.3px;letter-spacing:0}
    .district-label .wing-number{font-family:Arial,sans-serif;font-size:3.45px;font-weight:700;letter-spacing:.18px;fill:#c15750}
    .district-label.label-hq .wing-letter{fill:#ffd6ac;font-size:12px;stroke:#a23c2c;stroke-width:.6px}
    .district-label.label-hq .wing-number{fill:#ffd1a4}
  </style>
  <g class="district-label" transform="translate(165 139)"><text class="wing-letter" text-anchor="middle" y="0">A</text><text class="wing-number" text-anchor="middle" y="5.9">DISTRICT 01</text></g>
    <g class="district-label" transform="translate(155 117)"><text class="wing-letter" text-anchor="middle" y="0">B</text><text class="wing-number" text-anchor="middle" y="5.9">DISTRICT 02</text></g>
    <g class="district-label" transform="translate(185 116)"><text class="wing-letter" text-anchor="middle" y="0">C</text><text class="wing-number" text-anchor="middle" y="5.9">DISTRICT 03</text></g>
