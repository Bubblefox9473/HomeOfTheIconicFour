  <rect x="30" y="12" width="255" height="225" fill="url(#blocks)" opacity=".65"/>
  <path d="M94 152L112 138L125 159L142 177L128 195L106 196L97 184Z" fill="#ef583d" opacity=".26"/>
  <path d="M94 152L112 138L125 159L142 177L128 195L106 196L97 184Z" fill="none" stroke="#f3a077" stroke-width="3.4" opacity=".6" filter="url(#soft-red-glow)"/>
