<svg xmlns="http://www.w3.org/2000/svg" viewBox="29 8 259 232" role="img" aria-labelledby="city-title city-desc">
<title id="city-title">The City — Wing District Map</title>
<desc id="city-desc">A reconstructed archival district map based on the supplied reference. All 25 visible Wings, A through Y, are labeled in their geographic positions. L Corp in District 12 is illuminated and marked as the location of NetherNova Headquarters. District Z is not shown in the reference.</desc>
<defs>
  <path id="city-outline" d="M 39 113 L 42 71 L 51 49 L 77 28 L 101 20 L 143 16 L 170 25 L 201 39 L 224 47 L 254 65 L 266 101 L 281 119 L 280 160 L 271 183 L 258 208 L 237 214 L 211 214 L 198 224 L 168 225 L 148 232 L 116 228 L 99 207 L 88 203 L 67 178 L 62 157 L 46 143 L 36 115 Z"/>
  <clipPath id="city-mask"><use href="#city-outline"/></clipPath>
  <radialGradient id="city-base" cx="49%" cy="45%" r="70%">
    <stop offset="0%" stop-color="#762723"/><stop offset="52%" stop-color="#451715"/><stop offset="100%" stop-color="#230d0e"/>
  </radialGradient>
  <radialGradient id="hq-light" cx="45%" cy="55%" r="60%">
    <stop offset="0%" stop-color="#f06d51" stop-opacity=".53"/><stop offset="62%" stop-color="#d94637" stop-opacity=".13"/><stop offset="100%" stop-color="#d94637" stop-opacity="0"/>
  </radialGradient>
  <pattern id="blocks" patternUnits="userSpaceOnUse" width="17" height="16">
    <path d="M0 3H17M3 0V16M0 11H17M12 3V11M8 11V16" stroke="#ed6c58" stroke-opacity=".13" stroke-width=".27"/>
    <path d="M4 4h4v3H4zM13 5h2v4h-2zM5 12h5v2H5z" fill="#f26b51" fill-opacity=".12"/>
  </pattern>
  <pattern id="fine-grid" patternUnits="userSpaceOnUse" width="5" height="5">
    <path d="M5 0H0V5" fill="none" stroke="#e46351" stroke-width=".22" stroke-opacity=".11"/>
  </pattern>
  <pattern id="street-grid" patternUnits="userSpaceOnUse" width="33" height="28" patternTransform="rotate(-9)">
    <path d="M1 0V28M0 8H33M13 8V28M13 20H33" stroke="#0c0709" stroke-opacity=".65" stroke-width=".9" fill="none"/>
  </pattern>
  <filter id="soft-red-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <filter id="pin-glow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="1.3"/>
  </filter>
  <filter id="paper-distress">
    <feTurbulence baseFrequency=".85" numOctaves="3" seed="13" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
  </filter>
</defs>

<!-- Only the City itself is depicted: the reference's circular perimeter,
     corner ornaments, compass and surrounding display frame are omitted. -->
<g clip-path="url(#city-mask)">
